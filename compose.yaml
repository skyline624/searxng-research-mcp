name: searxng-research-mcp
services:
  mcp:
    build: .
    image: searxng-research-mcp:local
    init: true
    cap_add: [NET_ADMIN]
    security_opt: [no-new-privileges:true]
    ports:
      - "127.0.0.1:${MCP_PORT:-8765}:8765"
    shm_size: 1gb
    env_file:
      - path: .env.llm
        required: false
    volumes:
      - state:/var/lib/research-mcp
      - ./certificates:/usr/local/share/ca-certificates/research-mcp:ro

volumes:
  state:
